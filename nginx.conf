server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 9m;

  # Security headers (CSP allows Google Fonts and the Mux HLS stream used by the hero)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; media-src 'self' blob: https://stream.mux.com https://*.mux.com; connect-src 'self' https://stream.mux.com https://*.mux.com https://api.groq.com; img-src 'self' data: blob:; worker-src 'self' blob:" always;

  # API reverse proxy (docker compose). Variable + resolver means nginx still starts if `api` is absent.
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $upstream http://api:8000;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location / {
    try_files $uri /index.html;
  }
}
